<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Rose & Ritual</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #faf7f5; padding: 20px; color: #332c2c; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #e8e0dc; }
    h1, h2 { font-family: serif; color: #4a3e3d; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .btn { background: #d8a7b1; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #b88691; }
    .btn-danger { background: #e74c3c; }
    .prod-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
  </style>
</head>
<body>

<div class="container">
  <h1>لوحة التحكم وتحديث المتجر</h1>
  <p>قم بتغيير الأسعار، الصور، والمعلومات هنا وسوف تتحدث في المتجر مباشرة.</p>
  <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

  <h2>1. إعدادات المتجر العامة</h2>
  <form id="configForm">
    <div class="form-group">
      <label>اسم المتجر:</label>
      <input type="text" id="cfgStoreName">
    </div>
    <div class="form-group">
      <label>رقم الواتساب (مثال: 212600000000):</label>
      <input type="text" id="cfgWhatsapp">
    </div>
    <div class="form-group">
      <label>رابط الواجهة الرئيسية (Hero Image URL):</label>
      <input type="url" id="cfgHeroImg">
    </div>
    <button type="submit" class="btn">حفظ الإعدادات</button>
  </form>

  <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">

  <h2>2. إضافة منتج جديد</h2>
  <form id="prodForm">
    <div class="form-group">
      <label>اسم المنتج:</label>
      <input type="text" id="pName" required>
    </div>
    <div class="form-group">
      <label>السعر (MAD):</label>
      <input type="number" id="pPrice" required>
    </div>
    <div class="form-group">
      <label>رابط الصورة (URL):</label>
      <input type="url" id="pImg" required>
    </div>
    <button type="submit" class="btn">إضافة المنتج</button>
  </form>

  <h3 style="margin-top: 25px;">المنتجات الحالية:</h3>
  <div id="productList"></div>
</div>

<script src="config.js"></script>
<script>
  const cfg = getStoreConfig();
  document.getElementById('cfgStoreName').value = cfg.storeName;
  document.getElementById('cfgWhatsapp').value = cfg.whatsappNumber;
  document.getElementById('cfgHeroImg').value = cfg.heroImage;

  document.getElementById('configForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const newCfg = {
      ...cfg,
      storeName: document.getElementById('cfgStoreName').value,
      whatsappNumber: document.getElementById('cfgWhatsapp').value,
      heroImage: document.getElementById('cfgHeroImg').value
    };
    localStorage.setItem('rr_store_config', JSON.stringify(newCfg));
    alert('تم حفظ البيانات بنجاح!');
  });

  function renderAdminProducts() {
    const products = getStoreProducts();
    document.getElementById('productList').innerHTML = products.map(p => `
      <div class="prod-item">
        <div>
          <strong>${p.name}</strong><br>
          <small>${p.price} MAD</small>
        </div>
        <button onclick="delProduct('${p.id}')" class="btn btn-danger">حذف</button>
      </div>
    `).join('');
  }

  document.getElementById('prodForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const products = getStoreProducts();
    products.push({
      id: 'p_' + Date.now(),
      name: document.getElementById('pName').value,
      category: 'General',
      price: parseFloat(document.getElementById('pPrice').value),
      image: document.getElementById('pImg').value
    });
    localStorage.setItem('rr_store_products', JSON.stringify(products));
    renderAdminProducts();
    document.getElementById('prodForm').reset();
  });

  function delProduct(id) {
    let products = getStoreProducts().filter(p => p.id !== id);
    localStorage.setItem('rr_store_products', JSON.stringify(products));
    renderAdminProducts();
  }

  renderAdminProducts();
</script>
</body>
</html>
